name: MN SHOT Android APK Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "Android SDK directory not found: $SDK"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "SDK directory verified: $SDK"

      - name: Extract ZIP and locate Android project
        shell: bash
        run: |
          set -euo pipefail
          SEARCH="$RUNNER_TEMP/mnshot-project"
          mkdir -p "$SEARCH"

          ZIP_COUNT=0
          while IFS= read -r -d '' ZIP_FILE; do
            ZIP_COUNT=$((ZIP_COUNT + 1))
            echo "ZIP found: $ZIP_FILE"
            if ! unzip -t "$ZIP_FILE"; then
              echo "ZIP integrity test failed: $ZIP_FILE"
              exit 1
            fi
            unzip -oq "$ZIP_FILE" -d "$SEARCH"
          done < <(find "$GITHUB_WORKSPACE" -type f -name '*.zip' -print0)

          echo "ZIP files processed: $ZIP_COUNT"

          PROJECT=""
          for BASE in "$GITHUB_WORKSPACE" "$SEARCH"; do
            if [ ! -d "$BASE" ]; then continue; fi
            while IFS= read -r -d '' SETTINGS; do
              CANDIDATE=$(dirname "$SETTINGS")
              if [ -d "$CANDIDATE/app" ]; then
                PROJECT="$CANDIDATE"
                break 2
              fi
            done < <(find "$BASE" -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print0)
          done

          if [ -z "$PROJECT" ]; then
            echo "Android project not found. Listing extracted files:"
            find "$SEARCH" -maxdepth 6 -type f | head -250
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Detected project: $PROJECT"
          ls -la "$PROJECT"
          ls -la "$PROJECT/app"

      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP/gradle"
          echo "$RUNNER_TEMP/gradle/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --version
          gradle --no-daemon assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MN-SHOT-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
