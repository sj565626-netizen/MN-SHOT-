name: Build MN SHOT Native APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
      - name: Build APK
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain assembleDebug 2>&1 | tee build.log
      - name: Show errors only
        if: failure()
        run: |
          echo "=========== ERRORS ==========="
          grep -E "^e: |error:|What went wrong|Execution failed|Could not " -A3 build.log | head -80 | tee errors.txt
          { echo '### Build errors (copy from here)'; echo '```'; cat errors.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MN-SHOT-Native-debug-apk
          path: app/build/outputs/apk/debug/*.apk
