name: Build MN SHOT APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project zip
        run: |
          ZIP=$(find .. -maxdepth 3 -name "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            ZIP=$(find . -maxdepth 3 -name "*.zip" | head -n 1)
          fi
          echo "Zip found: $ZIP"
          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP file nahi mili"
            exit 1
          fi

          rm -rf _mn_extract_tmp
          mkdir -p _mn_extract_tmp
          unzip -qo "$ZIP" -d _mn_extract_tmp

          PROJ_ROOT=$(find _mn_extract_tmp -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1 | xargs -r dirname)
          if [ -z "$PROJ_ROOT" ]; then
            echo "ERROR: ZIP ke andar settings.gradle nahi mili"
            exit 1
          fi

          shopt -s dotglob nullglob
          for item in "$PROJ_ROOT"/*; do
            base=$(basename "$item")
            if [ "$base" != ".github" ] && [ "$base" != "_mn_extract_tmp" ]; then
              rm -rf "./$base"
              mv "$item" "./$base"
            fi
          done
          rm -rf _mn_extract_tmp

          test -f "settings.gradle" || test -f "settings.gradle.kts"
          echo "settings.gradle root mein mil gayi."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify project files
        run: |
          test -s app/src/main/AndroidManifest.xml
          grep -q 'MN SHOT' app/src/main/AndroidManifest.xml
          grep -q 'media3-transformer' app/build.gradle
          test -f app/src/main/java/com/mnshot/studio/MainActivity.kt
          test -f app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -f app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MN-SHOT-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          
