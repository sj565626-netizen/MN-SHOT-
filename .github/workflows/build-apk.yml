name: MN SHOT Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare project files
        shell: bash
        run: |
          set -e

          mkdir -p build_project

          # If ZIP was uploaded to repository, extract it.
          find . -maxdepth 3 -type f -name "*.zip" \
            ! -path "./build_project/*" | while read zipfile; do
              unzip -o "$zipfile" -d build_project
            done

          # Detect project folder
          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            cp -r . build_project/root_project
          fi

          PROJECT_DIR=""

          if [ -f "build_project/phase19work/settings.gradle" ]; then
            PROJECT_DIR="build_project/phase19work"
          elif [ -f "build_project/phase19work/settings.gradle.kts" ]; then
            PROJECT_DIR="build_project/phase19work"
          else
            PROJECT_DIR=$(find build_project -name settings.gradle \
              -o -name settings.gradle.kts | head -1 | xargs dirname)
          fi

          if [ -z "$PROJECT_DIR" ] || [ ! -d "$PROJECT_DIR/app" ]; then
            echo "Android project not found!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          sdkmanager "platform-tools"

      - name: Install Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MN-SHOT-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
