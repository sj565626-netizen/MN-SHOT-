name: MN SHOT Android APK Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components and accept licenses
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -executable | head -n 1)
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME/platforms"

      - name: Find or extract Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mnshot-unpacked"

          while IFS= read -r -d '' z; do
            unzip -oq "$z" -d "$RUNNER_TEMP/mnshot-unpacked"
          done < <(find "$GITHUB_WORKSPACE" -type f -name '*.zip' -print0)

          PROJECT=""
          for ROOT in "$GITHUB_WORKSPACE" "$RUNNER_TEMP/mnshot-unpacked"; do
            while IFS= read -r -d '' settings; do
              candidate=$(dirname "$settings")
              if [ -d "$candidate/app" ]; then
                PROJECT="$candidate"
                break 2
              fi
            done < <(find "$ROOT" -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print0)
          done

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Could not locate Android project with app module."
            find "$GITHUB_WORKSPACE" -maxdepth 4 -type f | head -200
            exit 1
          fi

          echo "Found project: $PROJECT"
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -x ./gradlew ]; then
            ./gradlew --no-daemon assembleDebug --stacktrace
          else
            wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O "$RUNNER_TEMP/gradle.zip"
            unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP/gradle"
            "$RUNNER_TEMP/gradle/gradle-8.9/bin/gradle" --no-daemon assembleDebug --stacktrace
          fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MN-SHOT-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
