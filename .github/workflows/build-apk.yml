name: MN SHOT Android APK Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "Android SDK not found at $SDK"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDK found: $SDK"

      - name: Install Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            SDKM="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          echo "Using sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" \
                  "platforms;android-33" \
                  "platforms;android-34" \
                  "platforms;android-35" \
                  "build-tools;34.0.0" \
                  "build-tools;35.0.0" > /dev/null

      - name: Extract ZIP projects
        run: |
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "No ZIP found in repo root, using repo files directly."
            exit 0
          fi
          mkdir -p extracted
          for z in "${zips[@]}"; do
            name="${z%.zip}"
            dest="extracted/$name"
            mkdir -p "$dest"
            echo "Extracting: $z -> $dest"
            if ! unzip -o -q "$z" -d "$dest"; then
              echo "::warning::Could not extract $z (file may be corrupted or incomplete). Skipping."
              rm -rf "$dest"
            fi
          done
          rm -rf extracted/*/__MACOSX
          ls -la extracted || true

      - name: Find Android project
        run: |
          find_project() {
            find "$1" -maxdepth 6 \
              \( -name node_modules -o -name .git -o -name .github -o -name build \) -prune -o \
              \( -name gradlew -o -name settings.gradle -o -name settings.gradle.kts \) -type f -print 2>/dev/null \
              | awk '{ n=gsub("/","/"); print n " " $0 }' | sort -n | head -n 1 | cut -d' ' -f2- | xargs -r dirname
          }

          PROJECT=""
          if [ -d extracted ]; then
            PROJECT="$(find_project extracted)"
          fi
          if [ -z "$PROJECT" ]; then
            PROJECT="$(find_project .)"
          fi

          if [ -z "$PROJECT" ]; then
            echo "::error::No Android project found (no gradlew / settings.gradle). Check your ZIP structure."
            echo "Repo contents:"
            ls -la
            exit 1
          fi

          echo "Android project: $PROJECT"
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Setup Gradle (only if project has no wrapper)
        if: ${{ hashFiles('**/gradlew') == '' }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

          if [ -f gradlew ]; then
            chmod +x gradlew
            GRADLE="./gradlew"
          else
            GRADLE="gradle"
          fi

          $GRADLE assembleDebug --stacktrace --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=512m"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MN-SHOT-APK
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
