name: MN SHOT Android APK Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        shell: bash
        run: |
          set -e

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          if [ ! -d "$SDK" ]; then
            SDK="/usr/local/android-sdk"
          fi

          if [ ! -d "$SDK" ]; then
            SDK=$(find /usr/local -type d -path "*/android/sdk" 2>/dev/null | head -1)
          fi

          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "Android SDK not found on runner"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          echo "SDK located at $SDK"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          SDKMANAGER=$(find "$ANDROID_HOME" -type f -name sdkmanager | head -1)

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract ZIP projects
        shell: bash
        run: |
          set -e

          mkdir -p "$RUNNER_TEMP/projects"

          find "$GITHUB_WORKSPACE" -type f -name "*.zip" \
            -print0 | while IFS= read -r -d '' zipfile; do
              unzip -oq "$zipfile" -d "$RUNNER_TEMP/projects"
            done

      - name: Find Android project
        shell: bash
        run: |
          set -e

          PROJECT=""

          while IFS= read -r settings; do
            DIR=$(dirname "$settings")

            if [ -d "$DIR/app" ]; then
              PROJECT="$DIR"
              break
            fi
          done < <(
            find "$GITHUB_WORKSPACE" "$RUNNER_TEMP/projects" \
              -type f \( -name "settings.gradle" \
              -o -name "settings.gradle.kts" \)
          )

          if [ -z "$PROJECT" ]; then
            echo "Android project not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Project: $PROJECT"

      - name: Build APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
            unzip -q gradle-8.9-bin.zip
            ./gradle-8.9/bin/gradle assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MN-SHOT-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
